<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIBI — Panneau</title>
<style>
  :root { --fond:#0d0b14; --carte:#171322; --bord:#2a2340; --violet:#a78bfa;
          --texte:#eae6f7; --gris:#8d84a8; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--fond); color:var(--texte); font:15px/1.5 "Segoe UI",system-ui,sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px;
           border-bottom:1px solid var(--bord); }
  .orbe { width:16px; height:16px; border-radius:50%;
          background:radial-gradient(circle at 35% 30%, #d8ccff, #7c5cff 60%, #3d2a80);
          box-shadow:0 0 12px #7c5cff88; }
  .orbe.reflechit { animation:pulse 1s infinite alternate; }
  @keyframes pulse { from { box-shadow:0 0 6px #7c5cff55; } to { box-shadow:0 0 18px #a78bfa; } }
  h1 { font-size:18px; font-weight:600; letter-spacing:.5px; }
  #etat { margin-left:auto; color:var(--gris); font-size:12.5px; text-align:right; }
  #etat b { color:var(--violet); font-weight:600; }
  main { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .bulle { max-width:78%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
  .jibi { background:var(--carte); border:1px solid var(--bord); border-bottom-left-radius:4px; align-self:flex-start; }
  .moi { background:#3d2a80; border-bottom-right-radius:4px; align-self:flex-end; }
  .actions { align-self:flex-start; display:flex; flex-wrap:wrap; gap:6px; }
  .puce { font-size:12px; color:var(--gris); border:1px solid var(--bord);
          border-radius:20px; padding:2px 10px; }
  .puce b { color:var(--violet); font-weight:600; }
  nav { display:flex; gap:8px; padding:0 18px 8px; flex-wrap:wrap; }
  nav button { background:var(--carte); color:var(--gris); border:1px solid var(--bord);
               border-radius:20px; padding:5px 13px; cursor:pointer; font-size:13px; }
  nav button:hover { color:var(--texte); border-color:var(--violet); }
  footer { display:flex; gap:10px; padding:12px 18px 16px; border-top:1px solid var(--bord); }
  #saisie { flex:1; background:var(--carte); border:1px solid var(--bord); color:var(--texte);
            border-radius:12px; padding:11px 14px; font:inherit; outline:none; }
  #saisie:focus { border-color:var(--violet); }
  #envoyer { background:var(--violet); color:#171225; border:none; border-radius:12px;
             padding:11px 20px; font-weight:600; cursor:pointer; }
  #envoyer:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <div class="orbe" id="orbe"></div>
  <h1>JIBI</h1>
  <div id="etat">…</div>
</header>
<main id="fil"></main>
<nav id="raccourcis"></nav>
<footer>
  <input id="saisie" placeholder="Demande quelque chose à JIBI… (Entrée pour envoyer)" autocomplete="off">
  <button id="envoyer">Envoyer</button>
</footer>
<script>
"use strict";
const fil = document.getElementById("fil"), saisie = document.getElementById("saisie"),
      bouton = document.getElementById("envoyer"), orbe = document.getElementById("orbe"),
      etat = document.getElementById("etat");

const RACCOURCIS = ["Quelle heure est-il ?", "Quelle batterie ?", "Ouvre Chrome",
                    "Lance un dé", "Pile ou face", "Quels onglets sont ouverts ?",
                    "Prends une note : penser à JIBI", "Liste mes rappels"];

function bulle(texte, moi) {
  const d = document.createElement("div");
  d.className = "bulle " + (moi ? "moi" : "jibi");
  d.textContent = texte;
  fil.appendChild(d);
  fil.scrollTop = fil.scrollHeight;
  return d;
}

function puces(actions) {
  if (!actions || !actions.length) return;
  const cont = document.createElement("div");
  cont.className = "actions";
  for (const a of actions) {
    const p = document.createElement("span");
    p.className = "puce";
    const b = document.createElement("b");
    b.textContent = a.outil || "?";
    p.appendChild(b);
    p.appendChild(document.createTextNode(" " + (a.texte || "").slice(0, 90)));
    cont.appendChild(p);
  }
  fil.appendChild(cont);
  fil.scrollTop = fil.scrollHeight;
}

async function envoyer(texte) {
  texte = (texte || saisie.value).trim();
  if (!texte) return;
  saisie.value = "";
  bulle(texte, true);
  bouton.disabled = true; saisie.disabled = true;
  orbe.classList.add("reflechit");
  const attente = bulle("…", false);
  try {
    const r = await fetch("/api/message", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({texte})
    });
    const j = await r.json();
    attente.textContent = j.reponse || "(réponse vide)";
    puces(j.actions);
  } catch (e) {
    attente.textContent = "Serveur injoignable — JIBI tourne toujours ?";
  }
  orbe.classList.remove("reflechit");
  bouton.disabled = false; saisie.disabled = false;
  saisie.focus();
  rafraichirEtat();
}

async function rafraichirEtat() {
  try {
    const j = await (await fetch("/api/etat")).json();
    etat.innerHTML = "<b>" + (j.ollama ? "prêt" : "Ollama éteint") + "</b> · " +
      j.modele + " · " + j.outils + " outils · " + j.heure;
  } catch (e) { etat.textContent = "hors ligne"; }
}

bouton.addEventListener("click", () => envoyer());
saisie.addEventListener("keydown", e => { if (e.key === "Enter") envoyer(); });
const navraccourcis = document.getElementById("raccourcis");
for (const r of RACCOURCIS) {
  const b = document.createElement("button");
  b.textContent = r;
  b.addEventListener("click", () => envoyer(r));
  navraccourcis.appendChild(b);
}
bulle("Salut ! Le panneau est prêt — écris-moi, tout reste sur ce PC.", false);
rafraichirEtat();
setInterval(rafraichirEtat, 10000);
saisie.focus();
</script>
</body>
</html>
