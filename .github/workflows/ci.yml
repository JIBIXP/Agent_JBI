# CI de JIBI 2 — dépôt public, exécution dans GitHub Actions uniquement.
# Aucun secret n'est requis et aucun n'est fourni.
# Une seule source de vérité : tests/verification.py (la suite hors-ligne du
# projet), précédée de deux filets : compilation intégrale et lint ciblé.
#
# Le lint ne garde que les règles qui attrapent des erreurs réelles
# (F821 : nom inconnu, F811 : redéfinition, F822 : import fantôme) ;
# les 84 avertissements stylistiques préexistants restent hors de la CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: windows-latest        # cible : le PC de l'utilisateur est Windows
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Version suivie : 3.13 (stable, bloquant) — et 3.14 en touche.
        python-version: ["3.13", "3.14"]
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt ruff

      - name: Compilation intégrale (erreurs de syntaxe)
        run: python -m compileall -q outils jibi2 interface tests docteur.py run.py mcp_server.py

      - name: Lint ciblé (F821, F811, F822)
        run: ruff check . --select F821,F811,F822

      - name: Suite de vérification hors-ligne
        # En cas d'échec, les dernières lignes du journal sont re-émises en
        # annotations d'erreur : rien de secret (la suite est hors-ligne et
        # n'imprime que ses vérifications), mais lisible publiquement.
        shell: pwsh
        run: |
          $sortie = (& python -X utf8 tests\verification.py 2>&1 | Out-String)
          Write-Host $sortie
          if ($LASTEXITCODE -ne 0) {
            foreach ($l in ($sortie.TrimEnd() -split "`r?`n" | Select-Object -Last 14)) {
              $court = if ($l.Length -gt 150) { $l.Substring($l.Length - 150) } else { $l }
              Write-Host "::error::$court"
            }
            exit 1
          }

      - name: Aucun secret dans le dépôt (longueur de .env)
        shell: pwsh
        run: |
          if (Test-Path .env) { Write-Error ".env présent : il ne doit PAS être commité" }
          if (-not (Test-Path .gitignore)) { Write-Error ".gitignore manquant" }
